[package]
name = "wxml-parser"
version = "0.1.0"
authors = ["juvanhe <juvanhe@tencent.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
glass-easel-template-compiler = { version = "0.18.0", default-features = false, features = ["js_bindings"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.83"
serde_json = "1.0.145"
regex = "1.12.2"
urlencoding = "2.1.3"
console_error_panic_hook = "0.1.7"
tsify = { version = "0.5.5", features = ["js"] }
web-sys = "0.3.83"
idna_adapter = "=1.2.0"
uuid = "=1.20.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
